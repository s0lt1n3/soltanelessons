<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>soltanelessons</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lora:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0f0e0c;
      --bg-gradient: radial-gradient(ellipse at 20% 50%, rgba(120, 81, 169, 0.15), transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(184, 134, 11, 0.1), transparent 50%);
      --panel: rgba(20, 19, 17, 0.65);
      --card: rgba(30, 28, 26, 0.8);
      --accent: #d4af37;
      --accent-2: #c9a961;
      --accent-dark: #8b6914;
      --text-main: #f5f1e8;
      --text-secondary: #b8b3a8;
      --line: rgba(212, 175, 55, 0.15);
      --line-light: rgba(212, 175, 55, 0.08);
      --success: #4ade80;
      --warning: #fbbf24;
      --danger: #ef4444;
      --shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      --glow: 0 0 20px rgba(212, 175, 55, 0.2);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Lora', serif;
      background: var(--bg) var(--bg-gradient);
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.03), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    a { color: inherit; text-decoration: none; }

    button, input, select, textarea {
      font: inherit;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 18px 80px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(15, 14, 12, 0.76);
      border-bottom: 1px solid var(--line);
      margin: 0 -18px 32px;
      padding: 16px 18px;
    }

    .topbar-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--bg);
      font-size: 1.2rem;
      font-weight: 800;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      font-family: 'Playfair Display', serif;
    }

    .brand .highlight { color: var(--accent); }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      background: rgba(30, 28, 26, 0.5);
      color: var(--text-main);
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .btn:hover {
      border-color: var(--accent);
      background: rgba(212, 175, 55, 0.08);
      box-shadow: 0 8px 28px rgba(212, 175, 55, 0.2);
      transform: translateY(-2px);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--bg);
      border-color: transparent;
      font-weight: 700;
      box-shadow: 0 8px 32px rgba(212, 175, 55, 0.3);
    }

    .btn.primary:hover {
      box-shadow: 0 12px 48px rgba(212, 175, 55, 0.4);
      transform: translateY(-3px);
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .search-wrap {
      background: rgba(30, 28, 26, 0.5);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line-light);
      background: rgba(20, 19, 17, 0.6);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-secondary);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(20, 19, 17, 0.8);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    #q {
      flex: 1;
      min-width: 240px;
      border: none;
      background: transparent;
      box-shadow: none;
      padding: 10px 4px;
    }

    .chip {
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(30, 28, 26, 0.6);
      border: 1px solid var(--line);
      font-size: 0.87rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.25s ease;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .chip:hover {
      border-color: var(--accent);
      background: rgba(212, 175, 55, 0.06);
      color: var(--accent);
    }

    .chip.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(201, 169, 97, 0.15));
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
      font-weight: 600;
    }

    .stats-row {
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08), transparent 50%);
      pointer-events: none;
    }

    .card:hover {
      border-color: rgba(212, 175, 55, 0.3);
      box-shadow: 0 20px 60px rgba(212, 175, 55, 0.1), 0 0 40px rgba(212, 175, 55, 0.05);
      transform: translateY(-4px);
    }

    .card h3 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 1.28rem;
      letter-spacing: -0.01em;
      font-weight: 700;
      color: var(--text-main);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.12);
      color: var(--accent);
      border: 1px solid rgba(212, 175, 55, 0.25);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.7rem;
    }

    .status {
      border: 1px solid var(--line-light);
      background: rgba(20, 19, 17, 0.5);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .status.s1 { color: var(--warning); border-color: rgba(251, 191, 36, 0.3); }
    .status.s2 { color: var(--accent); border-color: rgba(212, 175, 55, 0.3); }
    .status.s3 { color: var(--success); border-color: rgba(74, 222, 128, 0.3); }

    .notes {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.8;
      white-space: pre-wrap;
      font-size: 0.95rem;
      font-weight: 400;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.08);
      color: var(--accent);
      border: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .actions-row {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--line-light);
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: rgba(30, 28, 26, 0.6);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .link-btn:hover {
      border-color: var(--accent);
      background: rgba(212, 175, 55, 0.08);
      color: var(--accent);
    }

    .empty {
      text-align: center;
      color: var(--text-secondary);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 48px 24px;
      grid-column: 1 / -1;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      line-height: 1.7;
      font-size: 1.05rem;
    }

    dialog {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 18px;
      width: min(600px, 94vw);
      padding: 32px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.65);
    }

    dialog h2 {
      margin: 0 0 18px;
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .small-text {
      color: var(--text-secondary);
      font-size: 0.8rem;
      min-height: 1.2em;
    }

    @media (max-width: 600px) {
      .wrap { padding-top: 20px; }
      .topbar-inner { align-items: flex-start; }
      .brand { font-size: 1.3rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">S</span>
        <span>soltane<span class="highlight">lessons</span></span>
      </div>
      <div class="actions">
        <button class="btn" id="bBackup">✦ Backup</button>
        <button class="btn primary" id="bNew">✨ New lesson</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="search-wrap row">
      <input id="q" type="search" placeholder="Search your lessons, notes, wisdom..." />
    </div>

    <div class="row" id="cats"></div>
    <div class="row stats-row" id="stats"></div>
    <div class="grid" id="list"></div>
  </div>

  <dialog id="dLesson">
    <h2 id="lhead">New lesson</h2>
    <label>Title</label>
    <input id="fTitle" maxlength="120" />
    <div class="row" style="margin-top: 12px;">
      <div style="flex:1; min-width: 180px;">
        <label>Category</label>
        <select id="fCat"></select>
      </div>
      <div style="flex:1; min-width: 180px;">
        <label>Status</label>
        <select id="fStatus">
          <option value="1">To study</option>
          <option value="2">Studying</option>
          <option value="3">Done</option>
        </select>
      </div>
    </div>
    <label>Tags (comma separated)</label>
    <input id="fTags" placeholder="exam, formulas, key concepts" />
    <label>Link (optional)</label>
    <input id="fUrl" placeholder="https://..." />
    <label>Notes</label>
    <textarea id="fNotes" placeholder="Write your key points, formulas, and insights here..."></textarea>
    <div id="lmsg" class="small-text" style="color:var(--danger); margin-top: 10px;"></div>
    <div class="dialog-actions">
      <button class="btn" id="lCancel">Cancel</button>
      <button class="btn primary" id="lSave">✓ Save</button>
    </div>
  </dialog>

  <dialog id="dCat">
    <h2>New category</h2>
    <input id="cName" maxlength="40" placeholder="e.g. Physics, Chemistry, History" />
    <div id="cmsg" class="small-text" style="color:var(--danger); margin-top: 10px;"></div>
    <div class="dialog-actions">
      <button class="btn" id="cCancel">Cancel</button>
      <button class="btn primary" id="cSave">✓ Add</button>
    </div>
  </dialog>

  <dialog id="dAsk">
    <h2 id="askText">Are you sure?</h2>
    <div class="dialog-actions">
      <button class="btn" id="askNo">Cancel</button>
      <button class="btn" id="askYes" style="background: linear-gradient(135deg, var(--danger), #dc2626); border-color: transparent; color: white; font-weight: 700;">✕ Delete</button>
    </div>
  </dialog>

  <dialog id="dBackup">
    <h2>Backup your lessons</h2>
    <p class="small-text" style="margin-top:0;">Copy this text and keep it somewhere safe. To restore, paste it here and click Import.</p>
    <textarea id="json" spellcheck="false"></textarea>
    <div id="bmsg" class="small-text" style="margin-top: 10px;"></div>
    <div class="dialog-actions">
      <button class="btn" id="bClose">Close</button>
      <button class="btn" id="bCopy">📋 Copy</button>
      <button class="btn primary" id="bImport">↻ Import</button>
    </div>
  </dialog>

  <script>
    const $ = s => document.querySelector(s);
    const STATUS = {1:'To study', 2:'Studying', 3:'Done'};

    const store = {
      get(k, d) {
        try {
          const v = localStorage.getItem(k);
          return v ? JSON.parse(v) : d;
        } catch { return d; }
      },
      set(k, v) {
        try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
      }
    };

    let cats = store.get('sl_cats', ['General','Math','Science','Languages']);
    let lessons = store.get('sl_lessons', []);
    const state = { cat: 'all', status: 'all', q: '' };
    let editId = null;

    function save() {
      store.set('sl_cats', cats);
      store.set('sl_lessons', lessons);
    }

    function h(tag, attrs = {}, ...children) {
      const e = document.createElement(tag);
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'class') e.className = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v);
      });
      children.flat().forEach(c => e.append(c));
      return e;
    }

    function safeUrl(u) {
      if (!u) return '';
      try {
        const x = new URL(u);
        return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : '';
      } catch { return ''; }
    }

    function ask(text, yes, label = 'Yes, delete') {
      $('#askText').textContent = text;
      $('#askYes').textContent = label;
      $('#askYes').onclick = () => { $('#dAsk').close(); yes(); };
      $('#dAsk').showModal();
    }

    function render() {
      const catBox = $('#cats');
      catBox.replaceChildren();
      const addChip = (val, label, count) => h('button', {
        class: 'chip ' + (state.cat === val ? 'active' : ''),
        onclick: () => { state.cat = val; render(); }
      }, label, h('span', { style: 'opacity:0.6; margin-left:6px; font-size: 0.9em;' }, String(count)));

      catBox.append(addChip('all', '◆ All', lessons.length));
      catBox.append(addChip('fav', '★ Favorites', lessons.filter(x => x.fav).length));
      cats.forEach(c => catBox.append(addChip(c, c, lessons.filter(x => x.cat === c).length)));
      catBox.append(h('button', { class: 'chip', onclick: openCat }, '+ Category'));
      if (cats.includes(state.cat) && state.cat !== 'General') {
        catBox.append(h('button', {
          class: 'chip',
          style: 'color:var(--danger)',
          onclick: () => delCat(state.cat)
        }, '✕ Delete'));
      }

      const statBox = $('#stats');
      statBox.replaceChildren();
      [['all','◆ Any status'], ['1','⊙ To study'], ['2','◉ Studying'], ['3','✓ Done']].forEach(([v, label]) => {
        statBox.append(h('button', {
          class: 'chip ' + (String(state.status) === v ? 'active' : ''),
          onclick: () => { state.status = v; render(); }
        }, label));
      });

      const q = state.q.toLowerCase();
      const items = lessons.filter(l => {
        const okCat = state.cat === 'all' || (state.cat === 'fav' ? l.fav : l.cat === state.cat);
        const okStatus = state.status === 'all' || String(l.status) === state.status;
        const okQ = !q ||
          l.title.toLowerCase().includes(q) ||
          (l.notes || '').toLowerCase().includes(q) ||
          (l.tags || []).some(t => t.toLowerCase().includes(q));
        return okCat && okStatus && okQ;
      });

      const list = $('#list');
      list.replaceChildren();
      if (!items.length) {
        list.append(h('div', { class: 'empty' }, lessons.length ? 'No lessons match these filters.' : 'No lessons yet. Press "✨ New lesson" to add your first one.'));
        return;
      }

      items.forEach(l => {
        const url = safeUrl(l.url);
        const s = Number(l.status) || 1;
        const card = h('div', { class: 'card' },
          h('div', { class: 'meta' },
            h('span', { class: 'badge' }, l.cat),
            h('button', {
              class: 'status s' + s,
              title: 'Click to change status',
              onclick: () => { l.status = s % 3 + 1; save(); render(); }
            }, STATUS[s])
          ),
          h('h3', {}, l.title),
          l.notes ? h('p', { class: 'notes' }, l.notes) : '',
          (l.tags && l.tags.length) ? h('div', { class: 'tags' }, l.tags.map(t => h('span', { class: 'tag' }, '#' + t))) : '',
          h('div', { class: 'actions-row' },
            h('button', {
              class: 'btn',
              title: 'Favorite',
              onclick: () => { l.fav = !l.fav; save(); render(); }
            }, l.fav ? '★' : '☆'),
            url ? h('a', { class: 'link-btn', href: url, target: '_blank', rel: 'noopener noreferrer' }, '🔗 Open') : '',
            h('button', { class: 'btn', onclick: () => openLesson(l.id) }, 'Edit'),
            h('button', { class: 'btn', onclick: () => ask('Delete "' + l.title + '"?', () => { lessons = lessons.filter(x => x.id !== l.id); save(); render(); }) }, 'Delete')
          )
        );
        list.append(card);
      });
    }

    function openCat() {
      $('#cName').value = '';
      $('#cmsg').textContent = '';
      $('#dCat').showModal();
      $('#cName').focus();
    }

    function saveCat() {
      const name = $('#cName').value.trim();
      if (!name) {
        $('#cmsg').textContent = 'Please enter a name.';
        return;
      }
      if (cats.some(c => c.toLowerCase() === name.toLowerCase())) {
        $('#cmsg').textContent = 'That category already exists.';
        return;
      }
      cats.push(name);
      state.cat = name;
      save();
      render();
      $('#dCat').close();
    }

    function delCat(name) {
      const n = lessons.filter(l => l.cat === name).length;
      ask('Delete category "' + name + '"?' + (n ? ' Its ' + n + ' lesson(s) will move to General.' : ''), () => {
        lessons.forEach(l => {
          if (l.cat === name) l.cat = 'General';
        });
        cats = cats.filter(c => c !== name);
        state.cat = 'all';
        save();
        render();
      });
    }

    function fillCats(selected) {
      const sel = $('#fCat');
      sel.replaceChildren();
      cats.forEach(c => sel.append(h('option', { value: c }, c)));
      sel.value = selected && cats.includes(selected) ? selected : cats[0];
    }

    function openLesson(id) {
      editId = id || null;
      const l = id ? lessons.find(x => x.id === id) : null;
      $('#lhead').textContent = l ? 'Edit lesson' : 'New lesson';
      $('#fTitle').value = l ? l.title : '';
      fillCats(l ? l.cat : 'General');
      $('#fStatus').value = l ? String(l.status || 1) : '1';
      $('#fTags').value = l ? (l.tags || []).join(', ') : '';
      $('#fUrl').value = l ? (l.url || '') : '';
      $('#fNotes').value = l ? (l.notes || '') : '';
      $('#lmsg').textContent = '';
      $('#dLesson').showModal();
      $('#fTitle').focus();
    }

    function saveLesson() {
      const title = $('#fTitle').value.trim();
      const rawUrl = $('#fUrl').value.trim();
      if (!title) {
        $('#lmsg').textContent = 'Please enter a title.';
        return;
      }
      if (rawUrl && !safeUrl(rawUrl)) {
        $('#lmsg').textContent = 'The link must start with http:// or https://';
        return;
      }

      const data = {
        title,
        cat: $('#fCat').value,
        status: Number($('#fStatus').value),
        tags: $('#fTags').value.split(',').map(t => t.trim()).filter(Boolean),
        url: rawUrl,
        notes: $('#fNotes').value.trim(),
        fav: false
      };

      if (editId) {
        const current = lessons.find(x => x.id === editId);
        if (current) Object.assign(current, data);
      } else {
        lessons.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), ...data });
      }

      save();
      render();
      $('#dLesson').close();
    }

    function openBackup() {
      $('#json').value = JSON.stringify({ cats, lessons }, null, 2);
      $('#bmsg').textContent = '';
      $('#dBackup').showModal();
    }

    function importBackup() {
      try {
        const d = JSON.parse($('#json').value);
        const nc = Array.isArray(d.cats) ? d.cats.filter(Boolean) : [];
        const nl = Array.isArray(d.lessons) ? d.lessons.filter(l => l && typeof l.title === 'string').map(l => ({
          id: String(l.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8)),
          title: l.title,
          cat: l.cat || 'General',
          status: Number(l.status) || 1,
          tags: Array.isArray(l.tags) ? l.tags.map(String) : [],
          url: safeUrl(l.url),
          notes: String(l.notes || ''),
          fav: !!l.fav
        })) : [];

        if (!nc.length && !nl.length) throw new Error('empty');
        cats = [...new Set(['General', ...nc, ...nl.map(l => l.cat)])];
        lessons = nl;
        state.cat = 'all';
        state.status = 'all';
        save();
        render();
        $('#bmsg').style.color = 'var(--success)';
        $('#bmsg').textContent = '✓ Imported ' + nl.length + ' lesson(s).';
      } catch {
        $('#bmsg').style.color = 'var(--danger)';
        $('#bmsg').textContent = 'That is not a valid backup.';
      }
    }

    $('#bNew').onclick = () => openLesson();
    $('#bBackup').onclick = openBackup;
    $('#lCancel').onclick = () => $('#dLesson').close();
    $('#lSave').onclick = saveLesson;
    $('#cCancel').onclick = () => $('#dCat').close();
    $('#cSave').onclick = saveCat;
    $('#cName').addEventListener('keydown', e => { if (e.key === 'Enter') saveCat(); });
    $('#askNo').onclick = () => $('#dAsk').close();
    $('#bClose').onclick = () => $('#dBackup').close();
    $('#bCopy').onclick = () => { $('#json').focus(); $('#json').select(); };
    $('#bImport').onclick = importBackup;
    $('#q').addEventListener('input', e => { state.q = e.target.value; render(); });

    render();
  </script>
</body>
</html>
