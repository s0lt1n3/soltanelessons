<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>soltanelessons</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --bg-2: #f0ece7;
      --panel: rgba(255,255,255,0.86);
      --card: #ffffff;
      --line: #e7e1d9;
      --text: #1f1d1a;
      --muted: #726a63;
      --accent: #d94d3d;
      --accent-2: #e38f3b;
      --accent-soft: #fff1ee;
      --success: #2f7d4b;
      --shadow: 0 18px 40px rgba(32, 24, 18, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(217, 77, 61, 0.10), transparent 25%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
    }

    a { color: inherit; }

    button, input, select, textarea {
      font: inherit;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 64px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(245, 243, 239, 0.76);
      border-bottom: 1px solid rgba(231, 225, 217, 0.85);
      margin: 0 -18px 20px;
      padding: 14px 18px;
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.04em;
      font-size: 1.3rem;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 0.85rem;
      box-shadow: 0 10px 20px rgba(217, 77, 61, 0.24);
    }

    .brand .accent { color: var(--accent); }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 6px 14px rgba(25, 20, 15, 0.03);
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(217, 77, 61, 0.5);
      box-shadow: 0 10px 18px rgba(25, 20, 15, 0.06);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), #ef6a52);
      color: white;
      border-color: transparent;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .search-wrap {
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px 12px;
      box-shadow: var(--shadow);
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      border-radius: 12px;
      padding: 11px 12px;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(217, 77, 61, 0.55);
      box-shadow: 0 0 0 4px rgba(217, 77, 61, 0.08);
    }

    #q {
      flex: 1;
      min-width: 220px;
      border: none;
      background: transparent;
      box-shadow: none;
      padding: 10px 4px;
    }

    .chip {
      border-radius: 999px;
      padding: 7px 12px;
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: rgba(217, 77, 61, 0.45);
      color: var(--text);
    }

    .chip.active {
      background: linear-gradient(135deg, var(--accent), #ee725e);
      color: white;
      border-color: transparent;
      box-shadow: 0 12px 22px rgba(217, 77, 61, 0.18);
    }

    .stats-row {
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
    }

    .card h3 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: -0.02em;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(217, 77, 61, 0.12);
      font-weight: 600;
    }

    .status {
      border: none;
      background: #f4efe9;
      color: var(--muted);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .status.s1 { color: var(--accent-2); }
    .status.s2 { color: var(--accent); }
    .status.s3 { color: var(--success); }

    .notes {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f7f5f2;
      color: var(--muted);
      border: 1px solid var(--line);
      font-size: 0.74rem;
    }

    .actions-row {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .link-btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 11px;
      background: white;
      color: var(--text);
      transition: border-color 0.15s ease;
    }

    .link-btn:hover {
      border-color: rgba(217, 77, 61, 0.48);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 42px 20px;
      grid-column: 1 / -1;
      box-shadow: var(--shadow);
      line-height: 1.6;
    }

    dialog {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.98);
      border-radius: 20px;
      width: min(560px, 92vw);
      padding: 22px;
      box-shadow: 0 22px 48px rgba(15, 10, 7, 0.18);
    }

    dialog::backdrop {
      background: rgba(20, 16, 12, 0.42);
    }

    dialog h2 {
      margin: 0 0 16px;
      font-size: 1.4rem;
      letter-spacing: -0.03em;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 600;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .small-text {
      color: var(--muted);
      font-size: 0.8rem;
      min-height: 1.2em;
    }

    @media (max-width: 600px) {
      .wrap { padding-top: 20px; }
      .topbar-inner { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">S</span>
        <span>soltane<span class="accent">lessons</span></span>
      </div>
      <div class="actions">
        <button class="btn" id="bBackup">Backup</button>
        <button class="btn primary" id="bNew">+ New lesson</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="search-wrap row">
      <input id="q" type="search" placeholder="Search lessons, notes, tags..." />
    </div>

    <div class="row" id="cats"></div>
    <div class="row stats-row" id="stats"></div>
    <div class="grid" id="list"></div>
  </div>

  <dialog id="dLesson">
    <h2 id="lhead">New lesson</h2>
    <label>Title</label>
    <input id="fTitle" maxlength="120" />
    <div class="row" style="margin-top: 12px;">
      <div style="flex:1; min-width: 180px;">
        <label>Category</label>
        <select id="fCat"></select>
      </div>
      <div style="flex:1; min-width: 180px;">
        <label>Status</label>
        <select id="fStatus">
          <option value="1">To study</option>
          <option value="2">Studying</option>
          <option value="3">Done</option>
        </select>
      </div>
    </div>
    <label>Tags (comma separated)</label>
    <input id="fTags" placeholder="exam, formulas" />
    <label>Link (optional)</label>
    <input id="fUrl" placeholder="https://..." />
    <label>Notes</label>
    <textarea id="fNotes" placeholder="Key points, formulas, reminders..."></textarea>
    <div id="lmsg" class="small-text" style="color:#c62828; margin-top: 10px;"></div>
    <div class="dialog-actions">
      <button class="btn" id="lCancel">Cancel</button>
      <button class="btn primary" id="lSave">Save</button>
    </div>
  </dialog>

  <dialog id="dCat">
    <h2>New category</h2>
    <input id="cName" maxlength="40" placeholder="e.g. Physics" />
    <div id="cmsg" class="small-text" style="color:#c62828; margin-top: 10px;"></div>
    <div class="dialog-actions">
      <button class="btn" id="cCancel">Cancel</button>
      <button class="btn primary" id="cSave">Add</button>
    </div>
  </dialog>

  <dialog id="dAsk">
    <h2 id="askText">Are you sure?</h2>
    <div class="dialog-actions">
      <button class="btn" id="askNo">Cancel</button>
      <button class="btn" id="askYes" style="background:#c62828;color:white;border-color:#c62828;">Yes, delete</button>
    </div>
  </dialog>

  <dialog id="dBackup">
    <h2>Backup</h2>
    <p class="small-text" style="margin-top:0;">Copy this text and keep it somewhere safe. To restore, paste it and click Import.</p>
    <textarea id="json" spellcheck="false"></textarea>
    <div id="bmsg" class="small-text" style="margin-top: 10px;"></div>
    <div class="dialog-actions">
      <button class="btn" id="bClose">Close</button>
      <button class="btn" id="bCopy">Select all</button>
      <button class="btn primary" id="bImport">Import</button>
    </div>
  </dialog>

  <script>
    const $ = s => document.querySelector(s);
    const STATUS = {1:'To study', 2:'Studying', 3:'Done'};

    const store = {
      get(k, d) {
        try {
          const v = localStorage.getItem(k);
          return v ? JSON.parse(v) : d;
        } catch { return d; }
      },
      set(k, v) {
        try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
      }
    };

    let cats = store.get('sl_cats', ['General','Math','Science','Languages']);
    let lessons = store.get('sl_lessons', []);
    const state = { cat: 'all', status: 'all', q: '' };
    let editId = null;

    function save() {
      store.set('sl_cats', cats);
      store.set('sl_lessons', lessons);
    }

    function h(tag, attrs = {}, ...children) {
      const e = document.createElement(tag);
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'class') e.className = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v);
      });
      children.flat().forEach(c => e.append(c));
      return e;
    }

    function safeUrl(u) {
      if (!u) return '';
      try {
        const x = new URL(u);
        return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : '';
      } catch { return ''; }
    }

    function ask(text, yes, label = 'Yes, delete') {
      $('#askText').textContent = text;
      $('#askYes').textContent = label;
      $('#askYes').onclick = () => { $('#dAsk').close(); yes(); };
      $('#dAsk').showModal();
    }

    function render() {
      const catBox = $('#cats');
      catBox.replaceChildren();
      const addChip = (val, label, count) => h('button', {
        class: 'chip ' + (state.cat === val ? 'active' : ''),
        onclick: () => { state.cat = val; render(); }
      }, label, h('span', { style: 'opacity:0.7; margin-left:6px;' }, String(count)));

      catBox.append(addChip('all', 'All', lessons.length));
      catBox.append(addChip('fav', '★ Favorites', lessons.filter(x => x.fav).length));
      cats.forEach(c => catBox.append(addChip(c, c, lessons.filter(x => x.cat === c).length)));
      catBox.append(h('button', { class: 'chip', onclick: openCat }, '+ Category'));
      if (cats.includes(state.cat) && state.cat !== 'General') {
        catBox.append(h('button', {
          class: 'chip',
          style: 'color:#c62828',
          onclick: () => delCat(state.cat)
        }, 'Delete "' + state.cat + '"'));
      }

      const statBox = $('#stats');
      statBox.replaceChildren();
      [['all','Any status'], ['1','To study'], ['2','Studying'], ['3','Done']].forEach(([v, label]) => {
        statBox.append(h('button', {
          class: 'chip ' + (String(state.status) === v ? 'active' : ''),
          onclick: () => { state.status = v; render(); }
        }, label));
      });

      const q = state.q.toLowerCase();
      const items = lessons.filter(l => {
        const okCat = state.cat === 'all' || (state.cat === 'fav' ? l.fav : l.cat === state.cat);
        const okStatus = state.status === 'all' || String(l.status) === state.status;
        const okQ = !q ||
          l.title.toLowerCase().includes(q) ||
          (l.notes || '').toLowerCase().includes(q) ||
          (l.tags || []).some(t => t.toLowerCase().includes(q));
        return okCat && okStatus && okQ;
      });

      const list = $('#list');
      list.replaceChildren();
      if (!items.length) {
        list.append(h('div', { class: 'empty' }, lessons.length ? 'No lessons match these filters.' : 'No lessons yet. Press "+ New lesson" to add your first one.'));
        return;
      }

      items.forEach(l => {
        const url = safeUrl(l.url);
        const s = Number(l.status) || 1;
        const card = h('div', { class: 'card' },
          h('div', { class: 'meta' },
            h('span', { class: 'badge' }, l.cat),
            h('button', {
              class: 'status s' + s,
              title: 'Click to change status',
              onclick: () => { l.status = s % 3 + 1; save(); render(); }
            }, STATUS[s])
          ),
          h('h3', {}, l.title),
          l.notes ? h('p', { class: 'notes' }, l.notes) : '',
          (l.tags && l.tags.length) ? h('div', { class: 'tags' }, l.tags.map(t => h('span', { class: 'tag' }, '#' + t))) : '',
          h('div', { class: 'actions-row' },
            h('button', {
              class: 'btn',
              title: 'Favorite',
              onclick: () => { l.fav = !l.fav; save(); render(); }
            }, l.fav ? '★' : '☆'),
            url ? h('a', { class: 'link-btn', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Open link') : '',
            h('button', { class: 'btn', onclick: () => openLesson(l.id) }, 'Edit'),
            h('button', { class: 'btn', onclick: () => ask('Delete "' + l.title + '"?', () => { lessons = lessons.filter(x => x.id !== l.id); save(); render(); }) }, 'Delete')
          )
        );
        list.append(card);
      });
    }

    function openCat() {
      $('#cName').value = '';
      $('#cmsg').textContent = '';
      $('#dCat').showModal();
      $('#cName').focus();
    }

    function saveCat() {
      const name = $('#cName').value.trim();
      if (!name) {
        $('#cmsg').textContent = 'Please enter a name.';
        return;
      }
      if (cats.some(c => c.toLowerCase() === name.toLowerCase())) {
        $('#cmsg').textContent = 'That category already exists.';
        return;
      }
      cats.push(name);
      state.cat = name;
      save();
      render();
      $('#dCat').close();
    }

    function delCat(name) {
      const n = lessons.filter(l => l.cat === name).length;
      ask('Delete category "' + name + '"?' + (n ? ' Its ' + n + ' lesson(s) will move to General.' : ''), () => {
        lessons.forEach(l => {
          if (l.cat === name) l.cat = 'General';
        });
        cats = cats.filter(c => c !== name);
        state.cat = 'all';
        save();
        render();
      });
    }

    function fillCats(selected) {
      const sel = $('#fCat');
      sel.replaceChildren();
      cats.forEach(c => sel.append(h('option', { value: c }, c)));
      sel.value = selected && cats.includes(selected) ? selected : cats[0];
    }

    function openLesson(id) {
      editId = id || null;
      const l = id ? lessons.find(x => x.id === id) : null;
      $('#lhead').textContent = l ? 'Edit lesson' : 'New lesson';
      $('#fTitle').value = l ? l.title : '';
      fillCats(l ? l.cat : 'General');
      $('#fStatus').value = l ? String(l.status || 1) : '1';
      $('#fTags').value = l ? (l.tags || []).join(', ') : '';
      $('#fUrl').value = l ? (l.url || '') : '';
      $('#fNotes').value = l ? (l.notes || '') : '';
      $('#lmsg').textContent = '';
      $('#dLesson').showModal();
      $('#fTitle').focus();
    }

    function saveLesson() {
      const title = $('#fTitle').value.trim();
      const rawUrl = $('#fUrl').value.trim();
      if (!title) {
        $('#lmsg').textContent = 'Please enter a title.';
        return;
      }
      if (rawUrl && !safeUrl(rawUrl)) {
        $('#lmsg').textContent = 'The link must start with http:// or https://';
        return;
      }

      const data = {
        title,
        cat: $('#fCat').value,
        status: Number($('#fStatus').value),
        tags: $('#fTags').value.split(',').map(t => t.trim()).filter(Boolean),
        url: rawUrl,
        notes: $('#fNotes').value.trim(),
        fav: false
      };

      if (editId) {
        const current = lessons.find(x => x.id === editId);
        if (current) Object.assign(current, data);
      } else {
        lessons.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), ...data });
      }

      save();
      render();
      $('#dLesson').close();
    }

    function openBackup() {
      $('#json').value = JSON.stringify({ cats, lessons }, null, 2);
      $('#bmsg').textContent = '';
      $('#dBackup').showModal();
    }

    function importBackup() {
      try {
        const d = JSON.parse($('#json').value);
        const nc = Array.isArray(d.cats) ? d.cats.filter(Boolean) : [];
        const nl = Array.isArray(d.lessons) ? d.lessons.filter(l => l && typeof l.title === 'string').map(l => ({
          id: String(l.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8)),
          title: l.title,
          cat: l.cat || 'General',
          status: Number(l.status) || 1,
          tags: Array.isArray(l.tags) ? l.tags.map(String) : [],
          url: safeUrl(l.url),
          notes: String(l.notes || ''),
          fav: !!l.fav
        })) : [];

        if (!nc.length && !nl.length) throw new Error('empty');
        cats = [...new Set(['General', ...nc, ...nl.map(l => l.cat)])];
        lessons = nl;
        state.cat = 'all';
        state.status = 'all';
        save();
        render();
        $('#bmsg').style.color = '#2e7d32';
        $('#bmsg').textContent = 'Imported ' + nl.length + ' lesson(s).';
      } catch {
        $('#bmsg').style.color = '#c62828';
        $('#bmsg').textContent = 'That is not a valid backup.';
      }
    }

    $('#bNew').onclick = () => openLesson();
    $('#bBackup').onclick = openBackup;
    $('#lCancel').onclick = () => $('#dLesson').close();
    $('#lSave').onclick = saveLesson;
    $('#cCancel').onclick = () => $('#dCat').close();
    $('#cSave').onclick = saveCat;
    $('#cName').addEventListener('keydown', e => { if (e.key === 'Enter') saveCat(); });
    $('#askNo').onclick = () => $('#dAsk').close();
    $('#bClose').onclick = () => $('#dBackup').close();
    $('#bCopy').onclick = () => { $('#json').focus(); $('#json').select(); };
    $('#bImport').onclick = importBackup;
    $('#q').addEventListener('input', e => { state.q = e.target.value; render(); });

    render();
  </script>
</body>
</html>
